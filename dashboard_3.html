<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warden Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a0f;
    --panel: #0c131c;
    --panel-2: #0f1824;
    --elevated: #131e2c;
    --border: rgba(148, 173, 204, 0.12);
    --border-strong: rgba(148, 173, 204, 0.22);
    --fg: #e6edf5;
    --fg-muted: #8a99ad;
    --fg-dim: #5c6b80;

    --accent: #22d3ee;
    --accent-dim: #0e7490;
    --accent-glow: rgba(34, 211, 238, 0.35);

    --critical: #ef4444;
    --high: #f97316;
    --medium: #eab308;
    --low: #3b82f6;
    --info: #64748b;
    --ok: #34d399;

    --dom-network: #3b82f6;
    --dom-application: #a78bfa;
    --dom-security: #f472b6;
    --dom-cloud_data: #34d399;
    --dom-default: #8a99ad;

    --org-rules_engine: #64748b;
    --org-completeness: #8a99ad;
    --org-skill_executor: #22d3ee;
    --org-agent: #a78bfa;
    --org-correlation: #34d399;
    --org-default: #5c6b80;

    /* STRIDE threat categories - a palette distinct from severity/domain/
       origin, so the same row can carry a severity, a domain and a STRIDE
       chip without any two colors reading as the same signal. */
    --stride-spoofing: #38bdf8;
    --stride-tampering: #fb7185;
    --stride-repudiation: #c084fc;
    --stride-information-disclosure: #2dd4bf;
    --stride-denial-of-service: #fbbf24;
    --stride-elevation-of-privilege: #f87171;
    --stride-default: #8a99ad;

    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 78% -10%, rgba(34, 211, 238, 0.06), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(59, 130, 246, 0.05), transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(148, 173, 204, 0.16);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 173, 204, 0.3); background-clip: padding-box; }

  .mono { font-family: var(--font-mono); font-variant-ligatures: none; }

  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .panel-flat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .glow-accent { box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25), 0 0 22px -6px var(--accent-glow); }

  .text-gradient {
    background: linear-gradient(180deg, #f4f9ff, #b9c6d6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 var(--accent-glow); }
    70% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }
  .pulse { animation: pulse-ring 2.4s infinite; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .rise { animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

  @media (prefers-reduced-motion: reduce) { .pulse, .rise { animation: none; } }

  /* ---- layout ---- */
  #app { display: flex; height: 100vh; overflow: hidden; }

  aside {
    width: 236px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: rgba(12, 19, 28, 0.6);
    backdrop-filter: blur(8px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    height: 64px; padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand-icon {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(34, 211, 238, 0.12);
    color: var(--accent);
  }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .brand-sub { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--fg-dim); }

  nav.sidenav { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .navitem {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 8px;
    font-size: 14px; color: var(--fg-muted);
    cursor: pointer; transition: all .15s; border: none; background: transparent;
    width: 100%; text-align: left; font-family: var(--font-sans);
  }
  .navitem:hover { background: rgba(255,255,255,0.04); color: var(--fg); }
  .navitem.active { background: rgba(34, 211, 238, 0.10); color: var(--fg); font-weight: 500; }
  .navitem svg { flex-shrink: 0; color: var(--fg-dim); }
  .navitem.active svg { color: var(--accent); }
  .navitem .navdot { margin-left: auto; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }

  .statuschip {
    margin: 0 12px 12px; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  .statusdot { width: 6px; height: 6px; border-radius: 999px; background: var(--ok); }
  .statuslabel { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--fg-dim); }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .content { flex: 1; overflow-y: auto; }
  .content-inner { max-width: 1300px; margin: 0 auto; padding: 28px 32px; }

  /* ---- primitives ---- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 4px 10px; font-size: 11px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; }
  .badge.sm { padding: 2px 8px; font-size: 10px; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--border); background: rgba(148,173,204,0.06); color: var(--fg-muted);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none; font-family: var(--font-sans); transition: all .15s;
  }
  .btn-accent { background: var(--accent); color: #04141a; }
  .btn-accent:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--fg-muted); }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--fg); }

  h1, h2, h3 { margin: 0; }

  /* ---- upload / empty state ---- */
  .dropzone {
    border: 1.5px dashed var(--border-strong);
    border-radius: 16px;
    padding: 64px 32px;
    text-align: center;
    transition: all .2s;
    cursor: pointer;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(34,211,238,0.04); }
  .dropzone-icon {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(34,211,238,0.10); color: var(--accent);
  }

  /* ---- doc grid ---- */
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .doc-card { padding: 20px; cursor: pointer; transition: all .15s; }
  .doc-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .doc-card-top { display: flex; align-items: flex-start; gap: 14px; }
  .doc-title { font-size: 15px; font-weight: 700; color: var(--fg); margin: 2px 0 4px; line-height: 1.3; }
  .doc-meta { font-size: 12px; color: var(--fg-dim); font-family: var(--font-mono); }

  /* ---- gauge ---- */
  .gauge-wrap { position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .gauge-value { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .gauge-num { font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .gauge-label { font-family: var(--font-mono); font-size: 8px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-dim); margin-top: 2px; }

  /* ---- detail header ---- */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--fg-dim); cursor: pointer; background: none; border: none;
    font-family: var(--font-sans); padding: 0; margin-bottom: 16px;
  }
  .back-link:hover { color: var(--fg); }

  .stat-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--fg-dim); margin-top: 10px; }
  .stat-row .sep { opacity: 0.5; }

  .group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 18px; }
  .group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); margin-bottom: 8px; }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 20px 0 0; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; font-size: 14px; color: var(--fg-dim);
    border: none; background: none; border-bottom: 2px solid transparent;
    cursor: pointer; font-family: var(--font-sans); transition: all .15s;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--fg-muted); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-panel { padding-top: 20px; }

  /* ---- findings ---- */
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filter-chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--fg-muted);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: var(--font-sans); transition: all .15s;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(34,211,238,0.08); }

  .finding {
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    background: var(--panel); margin-bottom: 10px; cursor: pointer;
  }
  .finding:hover { border-color: var(--border-strong); }
  .finding-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .finding-issue { font-size: 14px; font-weight: 600; color: var(--fg); margin-top: 8px; line-height: 1.4; }
  .finding-section { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); margin-top: 4px; }
  .finding-body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
  .finding.expanded .finding-body { display: block; }
  .finding-field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-dim); margin-bottom: 4px; margin-top: 10px; }
  .finding-field-label:first-child { margin-top: 0; }
  .finding-text { font-size: 13px; color: var(--fg-muted); line-height: 1.5; }
  .finding-excerpt { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); background: var(--panel-2); border-radius: 8px; padding: 10px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .chevron { margin-left: auto; color: var(--fg-dim); transition: transform .15s; flex-shrink: 0; }
  .finding.expanded .chevron { transform: rotate(90deg); }

  /* ---- coverage bars ---- */
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-label { width: 150px; flex-shrink: 0; font-size: 12px; color: var(--fg-muted); }
  .bar-track { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .bar-count { width: 34px; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); }

  .empty-note { color: var(--fg-dim); font-size: 13px; padding: 24px; text-align: center; }

  /* ---- threat model ---- */
  .stride-matrix { border-collapse: collapse; width: 100%; font-size: 12px; }
  .stride-matrix th { text-align: center; font-weight: 600; color: var(--fg-muted); padding: 6px 10px; font-size: 10.5px; line-height: 1.3; white-space: nowrap; }
  .stride-matrix-domain { padding: 6px 10px 6px 0; white-space: nowrap; }
  .stride-cell { text-align: center; padding: 8px 10px; border-radius: 8px; font-family: var(--font-mono); font-weight: 600; min-width: 46px; }
  .stride-cell.gap { color: var(--fg-dim); background: rgba(255,255,255,0.03); font-weight: 400; }
  .crossing-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--border); font-size: 12px; }
  .crossing-row:first-of-type { border-top: none; }
  .crossing-row svg { color: var(--fg-dim); flex-shrink: 0; }

  input[type=file] { display: none; }
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="brand">
      <div class="brand-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3Z"/></svg>
      </div>
      <div>
        <div class="brand-name text-gradient">WARDEN</div>
        <div class="brand-sub">Review Console</div>
      </div>
    </div>
    <nav class="sidenav">
      <button class="navitem active" id="nav-overview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Overview
      </button>
      <button class="navitem" id="nav-load">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Load Results
      </button>
    </nav>
    <div class="statuschip" id="status-chip">
      <span class="statusdot"></span>
      <span class="statuslabel" id="status-label">no data loaded</span>
    </div>
  </aside>

  <main>
    <div class="content">
      <div class="content-inner" id="view-root"></div>
    </div>
  </main>
</div>

<input type="file" id="file-input" accept="application/json" />

<script>
(function () {
  "use strict";

  var STATE = { documents: [], activeDoc: null, tab: "findings", severityFilter: null, originFilter: null, strideFilter: null, generatedAt: null };

  var SEVERITY_ORDER = ["CRITICAL", "HIGH", "MEDIUM", "LOW"];
  var STRIDE_ORDER = ["Spoofing", "Tampering", "Repudiation", "Information Disclosure", "Denial of Service", "Elevation of Privilege"];
  var SEVERITY_COLOR = { CRITICAL: "var(--critical)", HIGH: "var(--high)", MEDIUM: "var(--medium)", LOW: "var(--low)" };
  var RAG_COLOR = { RED: "var(--critical)", AMBER: "var(--medium)", GREEN: "var(--ok)" };

  function domainColor(d) {
    var key = "--dom-" + (d || "").toLowerCase();
    return "var(" + key + ", var(--dom-default))";
  }
  function originColor(o) {
    var key = "--org-" + (o || "").toLowerCase();
    return "var(" + key + ", var(--org-default))";
  }
  function strideColor(cat) {
    var key = "--stride-" + (cat || "").toLowerCase().replace(/\s+/g, "-");
    return "var(" + key + ", var(--stride-default))";
  }

  /* ---------------------------------------------------------- icons */
  function icon(name, cls) {
    var paths = {
      "arrow-left": '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      "chevron-right": '<polyline points="9 18 15 12 9 6"/>',
      "file-text": '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
      "layers": '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
      "clock": '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      "shield-check": '<path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
      "shield-alert": '<path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3Z"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.51"/>',
      "git-branch": '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
    };
    return '<svg class="' + (cls || "") + '" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || "") + '</svg>';
  }

  /* ---------------------------------------------------------- normalization (supports old + new export shapes) */
  function normalizeFinding(f) {
    return {
      section: f.section || "",
      domain: f.domain || "unknown",
      severity: (f.severity || "LOW").toUpperCase(),
      issue: f.issue || f.title || "(untitled finding)",
      recommendation: f.recommendation || "",
      standard_reference: f.standard_reference || "",
      evidence_excerpt: f.evidence_excerpt || "",
      origin: f.origin || "agent",
      rule_id: f.rule_id || "",
      confidence: typeof f.confidence === "number" ? f.confidence : null,
    };
  }

  function normalizeDocument(d) {
    var findings = (d.findings || []).map(normalizeFinding);
    var counts = d.severity_counts;
    if (!counts) {
      counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
      findings.forEach(function (f) { counts[f.severity] = (counts[f.severity] || 0) + 1; });
    }
    var byOrigin = d.by_origin || {};
    if (!Object.keys(byOrigin).length) {
      findings.forEach(function (f) { byOrigin[f.origin] = (byOrigin[f.origin] || 0) + 1; });
    }
    var score = typeof d.risk_score === "number" ? d.risk_score : estimateScore(counts);
    var rag = d.rag_status || (counts.CRITICAL > 0 ? "RED" : score >= 12 ? "AMBER" : "GREEN");
    return {
      name: d.name || "untitled",
      elapsed_s: d.elapsed_s || 0,
      sections_count: d.sections_count || null,
      total_findings: d.total_findings != null ? d.total_findings : findings.length,
      risk_score: score,
      rag_status: rag,
      severity_counts: counts,
      by_origin: byOrigin,
      findings: findings,
      threat_model: d.threat_model || null,
    };
  }
  function estimateScore(counts) {
    var weights = { CRITICAL: 40, HIGH: 15, MEDIUM: 5, LOW: 1 };
    var raw = 0;
    Object.keys(counts).forEach(function (k) { raw += (weights[k] || 0) * counts[k]; });
    return Math.round(Math.min(100, 100 * (1 - Math.exp(-raw / 60))) * 10) / 10;
  }

  function loadData(json) {
    var docsRaw = Array.isArray(json) ? json : (json.documents || []);
    STATE.documents = docsRaw.map(normalizeDocument);
    STATE.generatedAt = json.generated_at || null;
    STATE.activeDoc = null;
    document.getElementById("status-label").textContent = STATE.documents.length + " report" + (STATE.documents.length === 1 ? "" : "s") + " loaded";
    render();
  }

  /* ---------------------------------------------------------- gauge */
  function gauge(value, size, color) {
    size = size || 72;
    var r = size * 0.417, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, value)) / 100);
    var cx = size / 2;
    return '' +
      '<div class="gauge-wrap" style="width:' + size + 'px;height:' + size + 'px;">' +
        '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg)">' +
          '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="rgba(148,173,204,0.12)" stroke-width="6"/>' +
          '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" ' +
            'stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" style="transition:stroke-dashoffset .6s"/>' +
        '</svg>' +
        '<div class="gauge-value">' +
          '<span class="gauge-num" style="color:' + color + ';font-size:' + Math.round(size * 0.25) + 'px">' + Math.round(value) + '</span>' +
          '<span class="gauge-label">risk</span>' +
        '</div>' +
      '</div>';
  }

  function badge(text, color, small) {
    return '<span class="badge' + (small ? ' sm' : '') + '" style="color:' + color + ';background:color-mix(in srgb,' + color + ' 12%, transparent);border:1px solid color-mix(in srgb,' + color + ' 35%, transparent)">' +
      '<span class="dot" style="background:' + color + '"></span>' + text + '</span>';
  }
  function chip(text, color) {
    if (color) {
      return '<span class="chip" style="color:' + color + ';background:color-mix(in srgb,' + color + ' 10%, transparent);border-color:color-mix(in srgb,' + color + ' 25%, transparent)">' + text + '</span>';
    }
    return '<span class="chip">' + text + '</span>';
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function formatLabel(s) {
    return String(s || "").split("_").map(function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  /* ---------------------------------------------------------- views */
  function render() {
    var root = document.getElementById("view-root");
    document.getElementById("nav-overview").classList.toggle("active", !STATE.activeDoc);
    document.getElementById("nav-load").classList.toggle("active", false);
    if (!STATE.documents.length) {
      root.innerHTML = emptyView();
      wireDropzone();
      return;
    }
    if (STATE.activeDoc) {
      root.innerHTML = detailView(STATE.activeDoc);
      wireDetail();
    } else {
      root.innerHTML = overviewView();
      wireOverview();
    }
  }

  function emptyView() {
    return '' +
      '<h1 style="font-size:20px;font-weight:800;margin-bottom:4px" class="text-gradient">Architecture Review Console</h1>' +
      '<p style="color:var(--fg-dim);font-size:13px;margin:0 0 28px">Load an <span class="mono">evaluation_results.json</span> export to view findings from a review run.</p>' +
      '<div class="dropzone" id="dropzone">' +
        '<div class="dropzone-icon">' + icon("layers", "").replace('width="14" height="14"', 'width="26" height="26"') + '</div>' +
        '<div style="font-size:15px;font-weight:600;margin-bottom:6px">Drop your results file here</div>' +
        '<div style="font-size:13px;color:var(--fg-dim);margin-bottom:18px">or click to browse for evaluation_results.json</div>' +
        '<span class="btn btn-accent">' + icon("file-text") + ' Choose File</span>' +
      '</div>';
  }

  function overviewView() {
    var cards = STATE.documents.map(function (d, i) {
      var color = RAG_COLOR[d.rag_status] || "var(--info)";
      return '' +
        '<div class="panel doc-card rise" data-idx="' + i + '">' +
          '<div class="doc-card-top">' +
            gauge(d.risk_score, 56, color) +
            '<div style="min-width:0">' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
                badge(d.rag_status, color, true) +
              '</div>' +
              '<div class="doc-title">' + esc(d.name) + '</div>' +
              '<div class="doc-meta">' + d.total_findings + ' findings &middot; ' + (d.sections_count != null ? d.sections_count + ' sections &middot; ' : "") + d.elapsed_s + 's</div>' +
            '</div>' +
          '</div>' +
          '<div class="filter-row" style="margin-top:14px;margin-bottom:0">' +
            SEVERITY_ORDER.filter(function (s) { return d.severity_counts[s]; }).map(function (s) {
              return chip(s.charAt(0) + s.slice(1).toLowerCase() + ' &middot; ' + d.severity_counts[s], SEVERITY_COLOR[s]);
            }).join("") +
          '</div>' +
        '</div>';
    }).join("");

    return '' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">' +
        '<div>' +
          '<h1 style="font-size:20px;font-weight:800" class="text-gradient">Review Reports</h1>' +
          '<p style="color:var(--fg-dim);font-size:13px;margin:4px 0 0">' + STATE.documents.length + ' document' + (STATE.documents.length === 1 ? "" : "s") + ' evaluated' + (STATE.generatedAt ? ' &middot; generated ' + esc(STATE.generatedAt) : "") + '</p>' +
        '</div>' +
        '<button class="btn btn-ghost" id="reload-btn">' + icon("file-text") + ' Load different file</button>' +
      '</div>' +
      '<div class="doc-grid">' + cards + '</div>';
  }

  function detailView(d) {
    var color = RAG_COLOR[d.rag_status] || "var(--info)";
    var domainCounts = {}, originCounts = d.by_origin || {};
    d.findings.forEach(function (f) { domainCounts[f.domain] = (domainCounts[f.domain] || 0) + 1; });

    var tabs = [
      { id: "findings", label: "Findings", icon: "file-text" },
      { id: "coverage", label: "Coverage", icon: "layers" },
    ];
    if (d.threat_model) {
      tabs.push({ id: "threatmodel", label: "Threat Model", icon: "shield-alert" });
    }

    return '' +
      '<button class="back-link" id="back-btn">' + icon("arrow-left") + ' All reports</button>' +
      '<div class="panel" style="padding:22px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">' +
          gauge(d.risk_score, 72, color) +
          '<div style="min-width:0;flex:1">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              badge(d.rag_status, color) +
              '<span class="chip mono">' + d.total_findings + ' findings</span>' +
            '</div>' +
            '<h1 style="font-size:18px;font-weight:700;margin-top:8px;line-height:1.3">' + esc(d.name) + '</h1>' +
            '<div class="stat-row">' +
              '<span>' + icon("clock") + ' ' + d.elapsed_s + 's review time</span>' +
              (d.sections_count != null ? '<span class="sep">&middot;</span><span class="mono">' + d.sections_count + ' sections</span>' : "") +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="group-grid">' +
          '<div class="panel-flat" style="padding:12px">' +
            '<div class="group-label">By severity</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
              (SEVERITY_ORDER.filter(function (s) { return d.severity_counts[s]; }).map(function (s) {
                return chip(s + ' &middot; ' + d.severity_counts[s], SEVERITY_COLOR[s]);
              }).join("") || '<span style="color:var(--fg-dim);font-size:12px">none</span>') +
            '</div>' +
          '</div>' +
          '<div class="panel-flat" style="padding:12px">' +
            '<div class="group-label">By origin layer</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
              (Object.keys(originCounts).map(function (o) {
                return chip(o + ' &middot; ' + originCounts[o], originColor(o));
              }).join("") || '<span style="color:var(--fg-dim);font-size:12px">none</span>') +
            '</div>' +
          '</div>' +
          '<div class="panel-flat" style="padding:12px">' +
            '<div class="group-label">By domain</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
              (Object.keys(domainCounts).map(function (dm) {
                return chip(dm + ' &middot; ' + domainCounts[dm], domainColor(dm));
              }).join("") || '<span style="color:var(--fg-dim);font-size:12px">none</span>') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tabs">' +
        tabs.map(function (t) {
          return '<button class="tab' + (STATE.tab === t.id ? ' active' : '') + '" data-tab="' + t.id + '">' + icon(t.icon) + t.label + '</button>';
        }).join("") +
      '</div>' +
      '<div class="tab-panel">' + (
        STATE.tab === "findings" ? findingsTab(d) :
        STATE.tab === "coverage" ? coverageTab(d) :
        STATE.tab === "threatmodel" && d.threat_model ? threatModelTab(d) :
        findingsTab(d)
      ) + '</div>';
  }

  function findingsTab(d) {
    var findings = d.findings.slice().sort(function (a, b) {
      return SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity);
    });
    if (STATE.severityFilter) findings = findings.filter(function (f) { return f.severity === STATE.severityFilter; });
    if (STATE.originFilter) findings = findings.filter(function (f) { return f.origin === STATE.originFilter; });

    var origins = Object.keys(d.by_origin || {});

    var sevFilters = SEVERITY_ORDER.filter(function (s) { return d.severity_counts[s]; }).map(function (s) {
      return '<button class="filter-chip' + (STATE.severityFilter === s ? " active" : "") + '" data-sev="' + s + '">' + s + ' (' + d.severity_counts[s] + ')</button>';
    }).join("");
    var orgFilters = origins.map(function (o) {
      return '<button class="filter-chip' + (STATE.originFilter === o ? " active" : "") + '" data-org="' + o + '">' + o + ' (' + d.by_origin[o] + ')</button>';
    }).join("");

    if (!findings.length) {
      return '<div class="filter-row">' + sevFilters + orgFilters + '</div><div class="panel-flat empty-note">No findings match the current filter.</div>';
    }

    var items = findings.map(function (f, i) {
      var sc = SEVERITY_COLOR[f.severity] || "var(--info)";
      return '' +
        '<div class="finding" data-fi="' + i + '">' +
          '<div class="finding-top">' +
            badge(f.severity, sc, true) +
            chip(f.origin, originColor(f.origin)) +
            chip(f.domain, domainColor(f.domain)) +
            (f.confidence != null ? '<span class="chip mono">conf ' + Math.round(f.confidence * 100) + '%</span>' : "") +
            '<span class="chevron">' + icon("chevron-right") + '</span>' +
          '</div>' +
          '<div class="finding-issue">' + esc(f.issue) + '</div>' +
          (f.section ? '<div class="finding-section">' + esc(f.section) + '</div>' : "") +
          '<div class="finding-body">' +
            (f.recommendation ? '<div class="finding-field-label">Recommendation</div><div class="finding-text">' + esc(f.recommendation) + '</div>' : "") +
            (f.standard_reference ? '<div class="finding-field-label">Standard reference</div><div class="finding-text mono">' + esc(f.standard_reference) + '</div>' : "") +
            (f.rule_id ? '<div class="finding-field-label">Rule ID</div><div class="finding-text mono">' + esc(f.rule_id) + '</div>' : "") +
            (f.evidence_excerpt ? '<div class="finding-field-label">Evidence</div><div class="finding-excerpt">' + esc(f.evidence_excerpt) + '</div>' : "") +
          '</div>' +
        '</div>';
    }).join("");

    return '<div class="filter-row">' + sevFilters + orgFilters + '</div>' + items;
  }

  function coverageTab(d) {
    var domainCounts = {};
    d.findings.forEach(function (f) { domainCounts[f.domain] = (domainCounts[f.domain] || 0) + 1; });
    var maxDom = Math.max.apply(null, Object.values(domainCounts).concat([1]));
    var maxOrg = Math.max.apply(null, Object.values(d.by_origin || {}).concat([1]));

    function bars(counts, max, colorFn) {
      return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).map(function (k) {
        var c = colorFn(k);
        return '<div class="bar-row"><div class="bar-label">' + esc(formatLabel(k)) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + (100 * counts[k] / max) + '%;background:' + c + '"></div></div>' +
          '<div class="bar-count">' + counts[k] + '</div></div>';
      }).join("");
    }

    return '' +
      '<div class="panel" style="padding:20px;margin-bottom:16px">' +
        '<h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Findings by domain</h3>' +
        bars(domainCounts, maxDom, domainColor) +
      '</div>' +
      '<div class="panel" style="padding:20px">' +
        '<h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Findings by origin layer</h3>' +
        bars(d.by_origin || {}, maxOrg, originColor) +
        '<p style="color:var(--fg-dim);font-size:11px;margin-top:14px">rules_engine = deterministic pre-checks &middot; skill_executor = TIER 1 pattern skills &middot; agent = LLM reasoning &middot; correlation = cross-domain pass</p>' +
      '</div>';
  }

  function threatModelTab(d) {
    var tm = d.threat_model;
    var threats = (tm.threats || []).slice();
    if (STATE.strideFilter) threats = threats.filter(function (t) { return t.stride_category === STATE.strideFilter; });
    threats.sort(function (a, b) { return SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity); });

    var domains = Object.keys(tm.stride_coverage || {}).sort();
    var blindByDomain = {};
    (tm.blind_spots || []).forEach(function (b) {
      (blindByDomain[b.domain] = blindByDomain[b.domain] || []).push(b.stride_category);
    });

    var strideFilters = STRIDE_ORDER.filter(function (c) { return (tm.stride_totals || {})[c]; }).map(function (c) {
      return '<button class="filter-chip' + (STATE.strideFilter === c ? " active" : "") + '" data-stride="' + esc(c) + '" style="' +
        (STATE.strideFilter === c ? 'border-color:' + strideColor(c) + ';color:' + strideColor(c) : '') + '">' +
        c + ' (' + tm.stride_totals[c] + ')</button>';
    }).join("");

    var matrix = '' +
      '<div class="panel" style="padding:20px;margin-bottom:16px">' +
        '<h3 style="font-size:14px;font-weight:600;margin-bottom:4px">STRIDE coverage matrix</h3>' +
        '<p style="color:var(--fg-dim);font-size:11px;margin-bottom:14px">Threats surfaced per domain per category. An empty cell is a coverage gap, not a clean bill of health - see caveats below.</p>' +
        '<div style="overflow-x:auto">' +
        '<table class="stride-matrix"><thead><tr><th></th>' +
          STRIDE_ORDER.map(function (c) { return '<th style="color:' + strideColor(c) + '">' + c.split(" ").join("<br>") + '</th>'; }).join("") +
        '</tr></thead><tbody>' +
          domains.map(function (dom) {
            var row = tm.stride_coverage[dom] || {};
            var gaps = blindByDomain[dom] || [];
            return '<tr><td class="stride-matrix-domain">' + chip(formatLabel(dom), domainColor(dom)) + '</td>' +
              STRIDE_ORDER.map(function (c) {
                var n = row[c] || 0;
                if (n === 0) {
                  return '<td class="stride-cell gap" title="Coverage gap: no ' + esc(c) + ' threats surfaced for ' + esc(dom) + '">&middot;</td>';
                }
                return '<td class="stride-cell" style="background:color-mix(in srgb,' + strideColor(c) + ' ' + Math.min(55, 18 + n * 12) + '%, transparent);color:' + strideColor(c) + '">' + n + '</td>';
              }).join("") +
            '</tr>';
          }).join("") +
        '</tbody></table>' +
        '</div>' +
      '</div>';

    var crossings = (tm.trust_boundary_crossings || []);
    var flowPanel = '' +
      '<div class="panel" style="padding:20px;margin-bottom:16px">' +
        '<h3 style="font-size:14px;font-weight:600;margin-bottom:4px">Trust zones &amp; boundary crossings</h3>' +
        '<p style="color:var(--fg-dim);font-size:11px;margin-bottom:14px">Inferred from section order and headings, not a verified data-flow diagram - confirm with the design authority before treating a crossing as fact.</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:' + (crossings.length ? '14px' : '0') + '">' +
          (tm.trust_zones || []).map(function (z) { return chip(formatLabel(z), "var(--accent)"); }).join("") +
        '</div>' +
        (crossings.length ? crossings.map(function (c) {
          return '<div class="crossing-row">' +
            '<span class="mono">' + esc(c.from_entity) + '</span>' + chip(formatLabel(c.from_zone), "var(--accent)") +
            icon("git-branch") +
            chip(formatLabel(c.to_zone), "var(--accent)") + '<span class="mono">' + esc(c.to_entity) + '</span>' +
          '</div>';
        }).join("") : '<div class="empty-note" style="padding:0">No trust-zone boundary crossings inferred between adjacent sections.</div>') +
      '</div>';

    var threatItems = threats.length ? threats.map(function (t) {
      var sc = SEVERITY_COLOR[t.severity] || "var(--info)";
      return '' +
        '<div class="finding">' +
          '<div class="finding-top">' +
            badge(t.severity, sc, true) +
            chip(t.stride_category, strideColor(t.stride_category)) +
            chip(formatLabel(t.target_domain), domainColor(t.target_domain)) +
            '<span class="chip mono">likelihood ' + esc(t.likelihood) + '</span>' +
          '</div>' +
          '<div class="finding-issue">' + esc(t.title) + '</div>' +
          (t.target_section ? '<div class="finding-section">' + esc(t.target_section) + '</div>' : "") +
          '<div class="finding-body" style="display:block">' +
            '<div class="finding-field-label">Existing mitigation</div><div class="finding-text">' + esc(t.existing_mitigation) + '</div>' +
            (t.recommended_mitigation ? '<div class="finding-field-label">Recommended mitigation</div><div class="finding-text">' + esc(t.recommended_mitigation) + '</div>' : "") +
            (t.standard_reference ? '<div class="finding-field-label">Standard reference</div><div class="finding-text mono">' + esc(t.standard_reference) + '</div>' : "") +
          '</div>' +
        '</div>';
    }).join("") : '<div class="panel-flat empty-note">No threats match the current filter.</div>';

    var footnote = (tm.caveats || []).map(function (c) {
      return '<p style="color:var(--fg-dim);font-size:11px;margin-top:6px">' + esc(c) + '</p>';
    }).join("");

    return matrix + flowPanel +
      '<div class="filter-row">' + strideFilters + '</div>' +
      threatItems +
      (tm.unclassified_findings ? '<p style="color:var(--fg-dim);font-size:11px;margin-top:10px">' + tm.unclassified_findings + ' finding(s) did not match a STRIDE category and are excluded from this view.</p>' : "") +
      footnote;
  }

  /* ---------------------------------------------------------- wiring */
  function wireDropzone() {
    var dz = document.getElementById("dropzone");
    if (!dz) return;
    dz.addEventListener("click", function () { document.getElementById("file-input").click(); });
    dz.addEventListener("dragover", function (e) { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", function () { dz.classList.remove("drag"); });
    dz.addEventListener("drop", function (e) {
      e.preventDefault(); dz.classList.remove("drag");
      if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
    });
  }
  function wireOverview() {
    document.querySelectorAll(".doc-card").forEach(function (el) {
      el.addEventListener("click", function () {
        STATE.activeDoc = STATE.documents[+el.getAttribute("data-idx")];
        STATE.tab = "findings"; STATE.severityFilter = null; STATE.originFilter = null; STATE.strideFilter = null;
        render();
      });
    });
    var rb = document.getElementById("reload-btn");
    if (rb) rb.addEventListener("click", function () { document.getElementById("file-input").click(); });
  }
  function wireDetail() {
    var back = document.getElementById("back-btn");
    if (back) back.addEventListener("click", function () { STATE.activeDoc = null; render(); });
    document.querySelectorAll(".tab").forEach(function (el) {
      el.addEventListener("click", function () { STATE.tab = el.getAttribute("data-tab"); render(); });
    });
    document.querySelectorAll("[data-sev]").forEach(function (el) {
      el.addEventListener("click", function () {
        var s = el.getAttribute("data-sev");
        STATE.severityFilter = STATE.severityFilter === s ? null : s;
        render();
      });
    });
    document.querySelectorAll("[data-org]").forEach(function (el) {
      el.addEventListener("click", function () {
        var o = el.getAttribute("data-org");
        STATE.originFilter = STATE.originFilter === o ? null : o;
        render();
      });
    });
    document.querySelectorAll("[data-stride]").forEach(function (el) {
      el.addEventListener("click", function () {
        var c = el.getAttribute("data-stride");
        STATE.strideFilter = STATE.strideFilter === c ? null : c;
        render();
      });
    });
    document.querySelectorAll(".finding").forEach(function (el) {
      el.addEventListener("click", function () { el.classList.toggle("expanded"); });
    });
  }

  function readFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var json = JSON.parse(e.target.result);
        loadData(json);
      } catch (err) {
        alert("Could not parse this file as JSON: " + err.message);
      }
    };
    reader.readAsText(file);
  }

  document.getElementById("file-input").addEventListener("change", function (e) {
    if (e.target.files.length) readFile(e.target.files[0]);
  });
  document.getElementById("nav-overview").addEventListener("click", function () { STATE.activeDoc = null; render(); });
  document.getElementById("nav-load").addEventListener("click", function () { document.getElementById("file-input").click(); });

  render();
})();
</script>

</body>
</html>
