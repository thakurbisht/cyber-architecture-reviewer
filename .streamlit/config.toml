[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#070B12"
secondaryBackgroundColor = "#0B1220"
textColor = "#E6EDF5"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Kept on: this is a local tool, and a hidden traceback (as with the
# get_layer1_findings crash) costs far more than it protects.
showErrorDetails = true

[logger]
level = "error"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
